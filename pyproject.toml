[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-ml"
version = "1.0.0"
description = "AETHER-ML — Adaptive Evidence-based Trust, Evaluation & Recovery for machine learning systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arghya Bose" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]
tracking = ["mlflow>=2.12"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data", "artifacts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"backend/app/database/migrations/*" = ["I001", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that load model weights or touch the dataset",
    "integration: multi-component integration tests",
    "e2e: end-to-end workflow tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["backend/app/database/migrations", "frontend"]
